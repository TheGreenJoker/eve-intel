<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESI Intel — Connexion…</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="eyebrow">Authentification</div>
      <h1 class="title">Connexion en cours…</h1>
      <div class="subtitle" id="status">Échange du code OAuth avec le SSO EVE Online.</div>
      <div class="err-msg" id="err"></div>
    </div>
  </div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  (async function () {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const state = params.get("state");
    const errParam = params.get("error");

    if (errParam) {
      document.getElementById("err").textContent = "Erreur SSO : " + errParam;
      return;
    }
    if (!code) {
      document.getElementById("err").textContent = "Aucun code reçu dans l'URL de callback.";
      return;
    }
    try {
      await completeLogin(code, state);
      document.getElementById("status").textContent = "Connecté. Redirection…";
      window.location.href = "index.html";
    } catch (e) {
      document.getElementById("err").textContent = e.message;
    }
  })();
</script>
</body>
</html>
